name: release

# Pushing a version tag, such as v0.1.0, publishes a release of its commit
# once ci passes on it: an archive of agora for macOS on arm64 and for Linux
# and Windows on amd64, and their SHA256SUMS. Running the workflow by hand
# builds and packages the release without publishing it; the files are the
# run's release artifact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    env:
      PLATFORMS: darwin/arm64 linux/amd64 windows/amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Name the version
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version=$GITHUB_REF_NAME
            if ! echo "$version" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::tag $version isn't a version such as v0.1.0"
              exit 1
            fi
          else
            version=dev-$(git rev-parse --short=12 HEAD)
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: make release PLATFORMS="$PLATFORMS"
      - name: Package
        run: |
          mkdir dist
          for p in $PLATFORMS; do
            os=${p%/*} arch=${p#*/}
            name=agora_${os}_${arch}_$VERSION
            if [ "$os" = windows ]; then
              zip -q -j -X "dist/$name.zip" "bin/$os-$arch/agora.exe"
            else
              tar -C "bin/$os-$arch" --owner=0 --group=0 --numeric-owner -czf "dist/$name.tar.gz" agora
            fi
          done
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes $prerelease
